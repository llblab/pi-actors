name: Validate

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Product validation (${{ matrix.os }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        shard: [installed, owners-a, owners-b]
    runs-on: ${{ matrix.os }}
    # Windows uses fresh native CIM observations; the expanded suite was still progressing at20minutes.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 20 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run validation preflight
        if: matrix.shard == 'installed'
        run: npm run validate:preflight
      - name: Run product test shard
        # Temporary, fixture-only evidence for the existing Windows CI failures; remove after convergence.
        env:
          PI_ACTORS_WINDOWS_BOUNDARY_TIMING: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
        run: npm run test:shard -- ${{ matrix.shard }}
      - name: Dry-pack product
        if: matrix.shard == 'installed'
        run: npm run pack:dry

  dependency-audit:
    name: Dependency audit (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm run audit:dependencies
